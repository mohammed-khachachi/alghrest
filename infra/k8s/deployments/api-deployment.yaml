apiVersion: apps/v1
kind: Deployment
metadata:
  name: alghrest-api
  namespace: alghrest
  labels:
    app: alghrest-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alghrest-api
  template:
    metadata:
      labels:
        app: alghrest-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: api
        image: alghrest/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: alghrest-config
        - secretRef:
            name: alghrest-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: alghrest-api-svc
  namespace: alghrest
spec:
  selector:
    app: alghrest-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
