# =============================================================================
# ALGHREST — Production Kafka Broker Configuration (server.properties)
# Enforces SASL/SCRAM-SHA-512 authentication, TLS encryption, default-deny ACLs,
# and strict 3-broker replication / durability invariants.
# =============================================================================

# ── Broker Identity & Coordination ──────────────────────────────────────────
broker.id=${KAFKA_BROKER_ID}
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000
zookeeper.set.acl=true

# ── Network Listeners & Security Protocol Map ───────────────────────────────
listeners=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
advertised.listeners=INTERNAL://kafka-${KAFKA_BROKER_ID}:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092
listener.security.protocol.map=INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL
inter.broker.listener.name=INTERNAL

# ── SASL / SCRAM Authentication ─────────────────────────────────────────────
sasl.enabled.mechanisms=SCRAM-SHA-512,SCRAM-SHA-256,PLAIN
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}";
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}";
listener.name.internal.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}" user_broker="${KAFKA_BROKER_PASSWORD}" user_alghrest="${KAFKA_APP_PASSWORD}";
listener.name.external.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}" user_broker="${KAFKA_BROKER_PASSWORD}" user_alghrest="${KAFKA_APP_PASSWORD}";

# ── TLS / SSL Transport Security ────────────────────────────────────────────
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/kafka.broker.keystore.p12
ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_SSL_KEY_PASSWORD}
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/kafka.broker.truststore.p12
ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https
ssl.client.auth=requested

# ── Authorization & Default-Deny ACL Enforcement ────────────────────────────
# ZooKeeper mode uses AclAuthorizer; KRaft mode uses org.apache.kafka.metadata.authorizer.StandardAuthorizer
authorizer.class.name=kafka.security.authorizer.AclAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:broker;User:alghrest

# ── Replication, Durability & Topic Safety ──────────────────────────────────
auto.create.topics.enable=false
delete.topic.enable=true
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
offsets.topic.replication.factor=3
offsets.topic.num.partitions=50
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
num.partitions=6

# ── Storage, Retention & Compression ────────────────────────────────────────
log.dirs=/var/lib/kafka/data
compression.type=lz4
log.retention.hours=168
log.segment.bytes=536870912
log.retention.check.interval.ms=300000
group.initial.rebalance.delay.ms=3000
message.max.bytes=10485760
replica.fetch.max.bytes=10485760
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
