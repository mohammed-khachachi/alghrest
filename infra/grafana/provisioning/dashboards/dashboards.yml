apiVersion: 1

providers:
  - name: ALGHREST Dashboards
    orgId: 1
    folder: ALGHREST
    folderUid: alghrest
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
