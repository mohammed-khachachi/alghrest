[tool.poetry]
name = "alghrest"
version = "0.1.0"
description = "ALGHREST — Event-driven trading agents, portfolio accounting, and research tooling"
authors = ["ALGHREST Team"]
readme = "README.md"
packages = [
    {include = "agents", from = "src"},
    {include = "core", from = "src"},
    {include = "connectors", from = "src"},
    {include = "ml", from = "src"},
    {include = "backtesting", from = "src"},
    {include = "api", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# ── AI / AGENT FRAMEWORKS ────────────────────────────────
anthropic = "^0.40.0"
mcp = "^1.0.0"
langgraph = "^0.2.0"
crewai = "^0.76.0"

# ── TRADING & MARKET DATA ────────────────────────────────
ccxt = {extras = ["async"], version = "^4.4.0"}
alpaca-py = "^0.30.0"
ib-insync = "^0.9.86"

# ── TECHNICAL ANALYSIS ───────────────────────────────────
# ta-lib requires separate binary installation: pip install ta-lib
# On Ubuntu: apt-get install ta-lib; On macOS: brew install ta-lib
pandas-ta = "^0.4.71b0"
vectorbt = "^1.0.0"
numba = "^0.61.2"      # hard-pinned by pandas-ta 0.4.x — bumped together

# ── DATA SCIENCE ─────────────────────────────────────────
pandas = "^2.3.2"
polars = "^1.0.0"
numpy = "^2.2.6"
scipy = "^1.14.0"
statsmodels = "^0.14.0"

# ── MACHINE LEARNING ─────────────────────────────────────
torch = "^2.4.0"
torchvision = "^0.19.0"
stable-baselines3 = {extras = ["extra"], version = "^2.3.0"}
ray = {extras = ["rllib", "tune"], version = "^2.35.0"}
scikit-learn = "^1.5.0"
opencv-python-headless = "^4.10.0"
mplfinance = "^0.12.10b0"
Pillow = "^10.4.0"

# ── QUANTITATIVE FINANCE ──────────────────────────────────
arch = "^7.1.0"     # GARCH/EGARCH models
py-vollib = "^1.0.1"

# ── MESSAGE BUS ───────────────────────────────────────────
aiokafka = {version = "^0.11.0", extras = ["lz4"]}
confluent-kafka = {extras = ["avro", "schemaregistry"], version = "^2.5.0"}
fastavro = "^1.9.0"

# ── DATABASE ─────────────────────────────────────────────
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"

# ── CACHE ────────────────────────────────────────────────
redis = {extras = ["hiredis"], version = "^5.1.0"}

# ── VECTOR DATABASE ───────────────────────────────────────
qdrant-client = "^1.11.0"

# ── API FRAMEWORK ─────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
websockets = "^13.0"

# ── BLOCKCHAIN ────────────────────────────────────────────
web3 = "^7.16.0"         # bumped from ^6.20 — v7 drops the lru-dict<1.3.0 cap (1.2.0 has no Windows cp312 wheel)

# ── DATA PROVIDERS ────────────────────────────────────────
httpx = {extras = ["http2"], version = "^0.27.0"}
aiohttp = "^3.10.0"
feedparser = "^6.0.11"   # RSS feeds
praw = "^7.7.0"          # Reddit
tweepy = "^4.14.0"       # Twitter/X

# ── ASYNC TASK QUEUE ──────────────────────────────────────
celery = {extras = ["redis"], version = "^5.4.0"}
flower = "^2.0.0"

# ── LOGGING & OBSERVABILITY ───────────────────────────────
structlog = "^24.4.0"
prometheus-client = "^0.21.0"
sentry-sdk = {extras = ["fastapi", "celery"], version = "^2.16.0"}
python-json-logger = "^2.0.7"

# ── NATURAL LANGUAGE PROCESSING ───────────────────────────
# spaCy is opt-in via `poetry install --with nlp`. The lock resolves compatible
# spaCy, thinc and NumPy versions. The news agent also needs a language model
# for entity extraction; without one it skips extraction gracefully.
vaderSentiment = "^3.3.2"
transformers = "^4.45.0"

# ── CONFIGURATION ─────────────────────────────────────────
python-dotenv = "^1.0.0"
dynaconf = "^3.2.0"

# ── UTILITIES ─────────────────────────────────────────────
tenacity = "^9.0.0"      # Retry logic with exponential backoff
orjson = "^3.10.0"       # Fast JSON
pendulum = "^3.0.0"      # Better datetime handling
rich = "^13.8.0"         # Pretty terminal output
typer = "^0.9.0"         # CLI
asyncpraw = ">=7.8,<8"
psutil = ">=5.9,<8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.11.0"
ruff = "^0.6.0"
black = "^24.10.0"
isort = "^5.13.0"
pre-commit = "^3.8.0"
ipykernel = "^6.29.0"
jupyter = "^1.1.0"
hypothesis = "^6.112.0"   # Property-based testing
pytest-timeout = "^2.4.0"
pytest-json-report = "^1.5.0"

[tool.poetry.group.backtesting.dependencies]
quantstats = "^0.0.62"
pyfolio-reloaded = "^0.9.5"

[tool.poetry.group.nlp]
optional = true

[tool.poetry.group.nlp.dependencies]
# Import compatibility with the locked NumPy version is checked during quality validation.
spacy = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── TOOL CONFIGURATIONS ───────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["research", "examples", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"src/ml/training/*" = ["T201"]  # Allow print in training scripts

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "connectors", "ml", "backtesting", "api", "scripts", "tests"]
combine-as-imports = true

[tool.black]
target-version = ["py312"]
line-length = 100
skip-string-normalization = false
extend-exclude = "(^|/)(research|examples|artifacts)/"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["agents", "core", "connectors", "ml", "backtesting", "api", "scripts", "tests"]
combine_as_imports = true

src_paths = ["src"]
extend_skip = ["research", "examples", "artifacts"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "src/ml/training/", "research/", "examples/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--cov=agents",
    "--cov=core",
    "--cov=connectors",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70"
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring external services",
    "backtest: backtesting tests (slow)",
    "live: tests requiring live exchange connections",
    "slow: tests with longer runtimes",
    "requires_kafka: tests requiring Kafka",
    "requires_redis: tests requiring Redis",
    "requires_db: tests requiring PostgreSQL",
    "smoke: basic smoke tests",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "*/migrations/*", "src/ml/training/*"]
