[tool.poetry]
name = "alghrest"
version = "0.1.0"
description = "ALGHREST — Production-grade autonomous multi-agent trading system (32 agents, 7 tiers)"
authors = ["ALGHREST Team"]
readme = "README.md"
python = "^3.12"
packages = [{include = "agents"}, {include = "core"}, {include = "connectors"}, {include = "ml"}, {include = "backtesting"}, {include = "api"}]

[tool.poetry.dependencies]
python = "^3.12"

# ── AI / AGENT FRAMEWORKS ────────────────────────────────
anthropic = "^0.40.0"
mcp = "^1.0.0"
langgraph = "^0.2.0"
crewai = "^0.76.0"

# ── TRADING & MARKET DATA ────────────────────────────────
ccxt = {extras = ["async"], version = "^4.4.0"}
alpaca-py = "^0.30.0"
ib-insync = "^0.9.86"

# ── TECHNICAL ANALYSIS ───────────────────────────────────
# ta-lib requires separate binary installation: pip install ta-lib
# On Ubuntu: apt-get install ta-lib; On macOS: brew install ta-lib
pandas-ta = "^0.3.14b"
vectorbt = "^0.26.2"

# ── DATA SCIENCE ─────────────────────────────────────────
pandas = "^2.2.0"
polars = "^1.0.0"
numpy = "^1.26.0"
scipy = "^1.14.0"
statsmodels = "^0.14.0"

# ── MACHINE LEARNING ─────────────────────────────────────
torch = "^2.4.0"
torchvision = "^0.19.0"
stable-baselines3 = {extras = ["extra"], version = "^2.3.0"}
ray = {extras = ["rllib", "tune"], version = "^2.35.0"}
scikit-learn = "^1.5.0"
opencv-python-headless = "^4.10.0"
mplfinance = "^0.12.10b0"
Pillow = "^10.4.0"

# ── QUANTITATIVE FINANCE ──────────────────────────────────
arch = "^7.1.0"     # GARCH/EGARCH models
py-vollib = "^1.0.1"

# ── MESSAGE BUS ───────────────────────────────────────────
aiokafka = "^0.11.0"
confluent-kafka = {extras = ["avro", "schemaregistry"], version = "^2.5.0"}
fastavro = "^1.9.0"

# ── DATABASE ─────────────────────────────────────────────
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"

# ── CACHE ────────────────────────────────────────────────
redis = {extras = ["hiredis"], version = "^5.1.0"}

# ── VECTOR DATABASE ───────────────────────────────────────
qdrant-client = "^1.11.0"

# ── API FRAMEWORK ─────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
websockets = "^13.0"

# ── BLOCKCHAIN ────────────────────────────────────────────
web3 = "^6.20.0"

# ── DATA PROVIDERS ────────────────────────────────────────
httpx = {extras = ["http2"], version = "^0.27.0"}
aiohttp = "^3.10.0"
feedparser = "^6.0.11"   # RSS feeds
praw = "^7.7.0"          # Reddit
tweepy = "^4.14.0"       # Twitter/X

# ── ASYNC TASK QUEUE ──────────────────────────────────────
celery = {extras = ["redis"], version = "^5.4.0"}
flower = "^2.0.0"

# ── LOGGING & OBSERVABILITY ───────────────────────────────
structlog = "^24.4.0"
prometheus-client = "^0.21.0"
sentry-sdk = {extras = ["fastapi", "celery"], version = "^2.16.0"}
python-json-logger = "^2.0.7"

# ── NATURAL LANGUAGE PROCESSING ───────────────────────────
spacy = "^3.8.0"
vaderSentiment = "^3.3.2"
transformers = "^4.45.0"

# ── CONFIGURATION ─────────────────────────────────────────
python-dotenv = "^1.0.0"
dynaconf = "^3.2.0"

# ── UTILITIES ─────────────────────────────────────────────
tenacity = "^9.0.0"      # Retry logic with exponential backoff
orjson = "^3.10.0"       # Fast JSON
pendulum = "^3.0.0"      # Better datetime handling
rich = "^13.8.0"         # Pretty terminal output
typer = "^0.12.0"        # CLI

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.11.0"
ruff = "^0.6.0"
black = "^24.10.0"
isort = "^5.13.0"
pre-commit = "^3.8.0"
ipykernel = "^6.29.0"
jupyter = "^1.1.0"
hypothesis = "^6.112.0"   # Property-based testing

[tool.poetry.group.backtesting.dependencies]
quantstats = "^0.0.62"
pyfolio-reloaded = "^0.9.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── TOOL CONFIGURATIONS ───────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"ml/training/*" = ["T201"]  # Allow print in training scripts

[tool.black]
target-version = ["py312"]
line-length = 100
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["agents", "core", "connectors", "ml", "backtesting", "api"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "ml/training/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=agents",
    "--cov=core",
    "--cov=connectors",
    "--cov-report=term-missing",
    # Coverage gate disabled until Critical fixes ship and full suite lands.
    # Re-enable to "--cov-fail-under=70" once unit + integration tests cover the new pipeline.
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring external services",
    "backtest: backtesting tests (slow)",
    "live: tests requiring live exchange connections",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "*/migrations/*", "ml/training/*"]
