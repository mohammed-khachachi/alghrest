# pytest.ini - Additional pytest configuration
# This supplements the configuration in pyproject.toml

[tool:pytest]
# Minimum Python version
minversion = 3.12

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Additional options
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeout for individual tests (in seconds)
timeout = 300

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

# Custom markers (also defined in pyproject.toml)
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - require external dependencies
    backtest: Backtesting tests - slow, data-intensive
    live: Live trading tests - require paper trading mode
    slow: Slow tests that should be run separately
    requires_kafka: Tests requiring Kafka infrastructure
    requires_redis: Tests requiring Redis infrastructure
    requires_db: Tests requiring database connectivity
    smoke: Basic smoke tests for CI/CD pipelines