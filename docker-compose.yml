  # API — FastAPI REST + WebSocket
  # ═══════════════════════════════════════════════════════

  api:
    build: .
    container_name: alghrest-api
    restart: unless-stopped
    command: sh -c "pip install structlog uvicorn fastapi pydantic-settings redis aiokafka prometheus-client orjson pendulum tenacity httpx aiohttp asyncpg sqlalchemy && python -m api.main"
    env_file: .env
    environment: *runtime-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.50
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req = urllib.request.Request('http://localhost:8000/health/live'); urllib.request.urlopen(req)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ═══════════════════════════════════════════════════════
  # DASHBOARD — React + Vite (dev server)
  # ═══════════════════════════════════════════════════════

  dashboard:
    build:
      context: ./dashboard
      target: development
    command: npm run dev -- --host 0.0.0.0
    container_name: alghrest-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.51

  # ═══════════════════════════════════════════════════════
  # NGINX — Reverse proxy (/ → dashboard, /api → fastapi, /ws → fastapi)
  # ═══════════════════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: alghrest-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
