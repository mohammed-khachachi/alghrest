name: alghrest

# Local trusted-host deployment. Live clients require SASL_SSL and a TLS broker overlay.
x-runtime-environment: &runtime-environment
  OPERATING_PROFILE: ${OPERATING_PROFILE:-general}
  DATABASE_URL: postgresql+asyncpg://alghrest:${POSTGRES_PASSWORD:?Set an explicit strong POSTGRES_PASSWORD}@timescaledb:5432/alghrest
  REDIS_URL: redis://redis:6379
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
  KAFKA_SASL_USERNAME: alghrest
  KAFKA_SASL_PASSWORD: ${KAFKA_APP_PASSWORD:?Run python -m scripts.configure_access}

networks:
  alghrest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  timescale-data:
    driver: local
  timescale-analytics-data:
    driver: local
  redis-data:
    driver: local
  kafka-data-1:
    driver: local
  kafka-data-2:
    driver: local
  kafka-data-3:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:

  # ═══════════════════════════════════════════════════════
  # DATABASE — TimescaleDB (PostgreSQL 16 + TimescaleDB)
  # Primary: trade data, OHLCV, positions, agent state
  # ═══════════════════════════════════════════════════════
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: alghrest-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: alghrest
      POSTGRES_USER: alghrest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an explicit strong POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_preload_libraries=timescaledb,pg_stat_statements
      -c timescaledb.telemetry_level=off
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/init/timescale-init.sql:/docker-entrypoint-initdb.d/01-timescale-init.sql:ro
      - ./infra/migrations/001_accounting.sql:/docker-entrypoint-initdb.d/02-accounting.sql:ro
      - ./infra/migrations/002_execution_recovery.sql:/docker-entrypoint-initdb.d/03-execution-recovery.sql:ro
      - ./infra/migrations/003_funding_performance.sql:/docker-entrypoint-initdb.d/04-funding-performance.sql:ro
      - ./infra/migrations/004_ai_budget.sql:/docker-entrypoint-initdb.d/05-ai-budget.sql:ro
      - ./infra/migrations/005_risk_halts.sql:/docker-entrypoint-initdb.d/06-risk-halts.sql:ro
      - ./infra/migrations/006_twap_plans.sql:/docker-entrypoint-initdb.d/07-twap-plans.sql:ro
      - ./infra/migrations/007_execution_authorizations.sql:/docker-entrypoint-initdb.d/08-execution-authorizations.sql:ro
      - ./infra/migrations/008_global_risk_halt.sql:/docker-entrypoint-initdb.d/09-global-risk-halt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alghrest -d alghrest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.2
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ─────────────────────────────────────────────────────
  # PostgreSQL Exporter (Prometheus metrics for TimescaleDB)
  # ─────────────────────────────────────────────────────
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: alghrest-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://alghrest:${POSTGRES_PASSWORD:?Set an explicit strong POSTGRES_PASSWORD}@timescaledb:5432/alghrest?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # CACHE — Redis 7 (real-time state, Pub/Sub, task queue)
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: alghrest-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --hz 20
      --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.5
    deploy:
      resources:
        limits:
          memory: 2500M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────────────
  # Redis Exporter (Prometheus metrics for Redis)
  # ─────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: alghrest-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.6
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # STREAMING — Zookeeper (Kafka coordination)
  # ═══════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: alghrest-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 100
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 10
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # STREAMING — Kafka Broker 1 (3-broker cluster)
  # ═══════════════════════════════════════════════════════
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alghrest-kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: &broker-jaas 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD:?Run python -m scripts.configure_access}" user_broker="${KAFKA_BROKER_PASSWORD}" user_alghrest="${KAFKA_APP_PASSWORD:?Run python -m scripts.configure_access}" user_tier1_executive="${KAFKA_TIER1_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier2_intelligence="${KAFKA_TIER2_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier3_quant="${KAFKA_TIER3_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier4_strategy="${KAFKA_TIER4_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier5_router="${KAFKA_TIER5_ROUTER_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier5_executor="${KAFKA_TIER5_EXECUTOR_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_tier7_monitoring="${KAFKA_TIER7_PASSWORD:-${KAFKA_APP_PASSWORD}}" user_advisory_reader="${KAFKA_ADVISORY_PASSWORD:-${KAFKA_APP_PASSWORD}}";'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: &broker-scram-jaas 'org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD:?Run python -m scripts.configure_access}";'
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:broker;User:alghrest"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_PRODUCER_MAX_REQUEST_SIZE: 10485760
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,state.change.logger=INFO,kafka.log.LogCleaner=INFO"
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9101:9101"
    volumes:
      - kafka-data-1:/var/lib/kafka/data
      - ./.secrets/kafka-client.properties:/run/secrets/kafka-client.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --command-config /run/secrets/kafka-client.properties --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ─────────────────────────────────────────────────────
  # Kafka Broker 2
  # ─────────────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alghrest-kafka-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:broker;User:alghrest"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_JMX_PORT: 9102
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,state.change.logger=INFO,kafka.log.LogCleaner=INFO"
    ports:
      - "127.0.0.1:9093:9093"
      - "127.0.0.1:9102:9102"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
      - ./.secrets/kafka-client.properties:/run/secrets/kafka-client.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9093 --command-config /run/secrets/kafka-client.properties --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.12
    deploy:
      resources:
        limits:
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ─────────────────────────────────────────────────────
  # Kafka Broker 3
  # ─────────────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alghrest-kafka-3
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *broker-scram-jaas
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:broker;User:alghrest"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_JMX_PORT: 9103
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,state.change.logger=INFO,kafka.log.LogCleaner=INFO"
    ports:
      - "127.0.0.1:9094:9094"
      - "127.0.0.1:9103:9103"
    volumes:
      - kafka-data-3:/var/lib/kafka/data
      - ./.secrets/kafka-client.properties:/run/secrets/kafka-client.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9094 --command-config /run/secrets/kafka-client.properties --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.13
    deploy:
      resources:
        limits:
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ═══════════════════════════════════════════════════════
  # STREAMING — Confluent Schema Registry
  # ═══════════════════════════════════════════════════════
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: alghrest-schema-registry
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: &app-jaas 'org.apache.kafka.common.security.plain.PlainLoginModule required username="alghrest" password="${KAFKA_APP_PASSWORD}";'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: http
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.15
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # STREAMING — Kafka Topic Initializer (one-shot)
  # Creates all 16 required topics with correct settings
  # ═══════════════════════════════════════════════════════
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alghrest-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./infra/init/kafka-init.sh:/kafka-init.sh:ro
      - ./infra/init/kafka-acls.sh:/kafka-acls.sh:ro
      - ./.secrets/kafka-client.properties:/run/secrets/kafka-client.properties:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_APP_PASSWORD: ${KAFKA_APP_PASSWORD:?Run python -m scripts.configure_access}
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?Run python -m scripts.configure_access}
      KAFKA_TIER1_PASSWORD: ${KAFKA_TIER1_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER2_PASSWORD: ${KAFKA_TIER2_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER3_PASSWORD: ${KAFKA_TIER3_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER4_PASSWORD: ${KAFKA_TIER4_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER5_ROUTER_PASSWORD: ${KAFKA_TIER5_ROUTER_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER5_EXECUTOR_PASSWORD: ${KAFKA_TIER5_EXECUTOR_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_TIER7_PASSWORD: ${KAFKA_TIER7_PASSWORD:-${KAFKA_APP_PASSWORD}}
      KAFKA_ADVISORY_PASSWORD: ${KAFKA_ADVISORY_PASSWORD:-${KAFKA_APP_PASSWORD}}
    networks:
      - alghrest-network
    restart: "no"

  # ═══════════════════════════════════════════════════════
  # STREAMING — Kafka UI (development monitoring)
  # ═══════════════════════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: alghrest-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: alghrest-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: *app-jaas
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: DISABLED
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.16
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # MONITORING — Prometheus (metrics collection)
  # Retention: 30 days | Port: 9090
  # ═══════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: alghrest-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --web.external-url=http://localhost:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      - ./.secrets/api_access_token:/run/secrets/api_access_token:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.20
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # MONITORING — Grafana (dashboards & alerting)
  # Dashboards: portfolio PnL, agent health, risk metrics
  # ═══════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.2
    container_name: alghrest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-alghrest_grafana_2024}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.21
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════
  # MONITORING — Node Exporter (host system metrics)
  # ═══════════════════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: alghrest-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      alghrest-network:
        ipv4_address: 172.28.0.22
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

